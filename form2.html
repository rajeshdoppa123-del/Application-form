<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Application form</title>
</head>
<body style="background-color: gray;">
	<h1 style="text-align: center;"><u>Application form</u></h1>
	<form>
		<img src="anudip.png" align="right">
		UserName<input type="text" name="UserName"><br>
		Password<input type="Password" name="Password"><br>
		Email:<input type="email" name="email"><br>
		DOB:<input type="date" name="dob">
		<h3>Gender</h3>
		<input type="Radio" name="Gender" value="Male">Male<br>
		<input type="Radio" name="Gender" value="Female">Female<br>
		<h3>Skills:</h3>
		<input type="checkbox" name="Skills" value="c">C<br>
		<input type="checkbox" name="Skills" value="c++">C++<br>
		<input type="checkbox" name="Skills" value="java">Java<br>
		<input type="checkbox" name="Skills" value="Python">Python<br>
		<h3>Address:</h3><textarea rows="1" cols="10">	
		</textarea><br>
		<h3>Country:</h3><select name="country">
			<option>india</option>
			<option>usa</option>
			<option>africa</option>
			<option>newzland</option>
			<option>corea</option>
		</select>
		<h3>States:</h3><select name="states">
			<option>telangana</option>
			<option>andhra</option>
			<option>delhi</option>
			<option>rajasthan</option>
			<option>jammu</option>
		</select>
		<h3>City:</h3><select name="city">
			<option>Hyderabad</option>
			<option>peddapalli</option>
			<option>karimnagar</option>
			<option>nizamabad</option>
			<option>suryapet</option>
		</select><br>
		<input type="submit" value="SUBMIT" style="background-color:red;">
		<input type="reset" value="RESET" style="background-color:red;"><br>

	</form>

</body>
</html>
